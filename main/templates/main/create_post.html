{% extends 'main/base.html' %}

{% block title %}
    Create a post
{% endblock %}

{% load crispy_forms_tags %}

{% block content %}
    <section class="form-page">
        <div class="form-panel">
            <div class="eyebrow">Publish</div>
            <h1>Create a post</h1>
            <p class="form-intro">Write something clear and useful, then publish it to the feed.</p>
            <form method="post">
                {% csrf_token %} 
                {{form|crispy}}
                <div class="form-actions">
                    <button type="submit" class="btn btn-success">Proceed</button>
                </div>
            </form>
        </div>
    </section>
{% endblock %}
